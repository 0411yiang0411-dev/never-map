<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>更新 never-map</title><body style="font:16px/1.8 system-ui;background:#f7f7fb;color:#282534;max-width:560px;margin:12vh auto;padding:24px"><h1 style="font-size:24px">更新画布程序</h1><p>保留本机画布、登录信息和未同步修改，只更新程序文件。</p><p id="status" role="status">正在获取最新版本…</p><button onclick="start()" style="padding:10px 18px;border:1px solid #ccc;border-radius:8px">重新尝试</button><script>
async function start(){const status=document.getElementById('status');status.textContent='正在获取最新版本…';try{if('serviceWorker' in navigator){const registration=await navigator.serviceWorker.getRegistration('/');if(registration){await registration.update();const worker=registration.installing||registration.waiting;if(worker&&worker.state!=='activated')await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('程序更新尚未完成，请重新尝试')),25000);const check=()=>{if(worker.state==='activated'){clearTimeout(timer);resolve();}else if(worker.state==='redundant'){clearTimeout(timer);reject(new Error('新版资源未能完整下载，请重新尝试'));}};worker.addEventListener('statechange',check);check();});}}status.textContent='程序已更新，正在打开画布…';setTimeout(()=>location.replace('/?updated='+Date.now()+location.hash),200);}catch(error){status.textContent=error.message+'。本机画布数据仍保留。';}}start();
</script></body></html>
