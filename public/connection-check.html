<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>never-map 加载检测</title><body style="font-family:sans-serif;padding:20px;line-height:1.7"><h2>never-map 加载检测</h2><p>此页无需画布程序，无需密码，不读取画布、图片或账号数据。</p><p>页面连接：已打开</p><p id="api">网站状态接口：检测中…</p><p id="asset">主程序文件：检测中…</p><p id="browser"></p><p><a href="/">返回画布</a> · <button onclick="location.reload()">重新检测</button></p><noscript>浏览器未启用 JavaScript。</noscript><script>
document.getElementById('browser').textContent='浏览器：'+navigator.userAgent;
var statusRequest=new XMLHttpRequest();statusRequest.open('GET','/api/status');statusRequest.timeout=15000;statusRequest.onload=function(){document.getElementById('api').textContent='网站状态接口：HTTP '+statusRequest.status;};statusRequest.onerror=statusRequest.ontimeout=function(){document.getElementById('api').textContent='网站状态接口：连接未完成';};statusRequest.send();
var page=new XMLHttpRequest();page.open('GET','/');page.timeout=15000;page.onload=function(){var match=page.responseText.match(/src="([^"]+\.js)"/);if(!match){document.getElementById('asset').textContent='主程序文件：页面没有脚本入口';return;}var script=new XMLHttpRequest();script.open('GET',match[1]);script.timeout=20000;script.onload=function(){document.getElementById('asset').textContent='主程序文件：HTTP '+script.status+'，'+script.getResponseHeader('Content-Type')+'，'+script.responseText.length+' 字符';};script.onerror=script.ontimeout=function(){document.getElementById('asset').textContent='主程序文件：连接未完成';};script.send();};page.onerror=page.ontimeout=function(){document.getElementById('asset').textContent='主程序文件：首页连接未完成';};page.send();
</script></body></html>
