name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle
      ANDROID_USER_HOME: ${{ github.workspace }}/.cache/android-user
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEVER_MAP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p .tmp/android-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .tmp/android-signing/never-map.p12
          chmod 600 .tmp/android-signing/never-map.p12
      - name: Build, test and lint
        env:
          NEVER_MAP_KEYSTORE_PATH: ${{ github.workspace }}/.tmp/android-signing/never-map.p12
          NEVER_MAP_STORE_PASSWORD: ${{ secrets.NEVER_MAP_STORE_PASSWORD }}
        run: gradle -p android --no-daemon --console=plain testReleaseUnitTest lintRelease assembleRelease
      - name: Verify APK signature
        run: |
          mkdir -p output/android
          cp android/app/build/outputs/apk/release/app-release.apk output/android/never-map.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs output/android/never-map.apk > output/android/apk-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/android/never-map.apk >> output/android/apk-verification.txt
          cat android/app/build/reports/lint-results-release.txt
          cd output/android
          sha256sum never-map.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: never-map-android
          path: output/android/
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f .tmp/android-signing/never-map.p12
